<div class="flex justify-between items-center mt-4">
      <!-- Quantity Incrementor -->
      <div
        class="flex items-center justify-between border border-gray-200 rounded-lg p-1 bg-gray-50 w-24"
      >
        <button
          (click)="decreaseQty()"
          [disabled]="isLoading()"
          class="w-6 h-6 flex items-center justify-center text-gray-600 hover:bg-gray-200 rounded-md transition-colors disabled:opacity-50"
        >
          <mat-icon class="!h-3 !w-3 !text-[12px]">remove</mat-icon>
        </button>

        @if (isLoading()) {
          <div
            class="w-6 h-6 border-2 border-gray-200 border-t-gray-600 rounded-full animate-spin"
          ></div>
        } @else {
          <span class="font-bold text-gray-900 text-xs">{{ quantity() }}</span>
        }

        <button
          (click)="increaseQty()"
          [disabled]="isLoading()"
          class="w-6 h-6 flex items-center justify-center text-gray-600 hover:bg-gray-200 rounded-md transition-colors disabled:opacity-50"
        >
          <mat-icon class="!h-3 !w-3 !text-[12px]">add</mat-icon>
        </button>
      </div>

      <!-- Price Breakdown -->
      <div class="text-right">
        <span class="text-lg font-black text-gray-950">
          {{ unitPrice() * quantity() | currency: 'GBP' : 'symbol' : '1.0-0' }}
        </span>
        @if (quantity() > 1) {
          <p class="text-[10px] text-gray-400">
            {{ unitPrice() | currency: 'GBP' : 'symbol' : '1.0-0' }} each
          </p>
        }
      </div>
    </div>
