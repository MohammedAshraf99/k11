<!-- Main Hero Carousel Section -->
<div
  class="relative w-full aspect-square h-[500px] md:h-[600px] bg-gray-950 overflow-hidden group"
>
  <!-- Slides Wrapper -->
  <div
    class="relative aspect-square w-full h-full flex transition-transform duration-700 ease-in-out"
    [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
  >
    <!-- Slide 1: Premium Oud Collection -->
    @for (banner of banners(); track banner._id) {
      <div class="w-full h-full shrink-0 relative flex items-center">
        <!-- Dark Overlay Gradient mask -->
        <div
          class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent z-10"
        ></div>
        <img
          [src]="banner.imageUrl"
          alt="Luxury Perfume Bottle"
          class="absolute inset-0 w-full h-full object-cover object-center animate-fade-in"
        />

        <!-- Slide Content -->
        <div
          class="relative z-20 max-w-7xl mx-auto px-6 md:px-12 w-full text-white"
        >
          <span
            class="text-amber-500 font-semibold tracking-wider text-sm uppercase block mb-2"
            >{{ banner.title }}</span
          >
          <h1
            class="text-4xl md:text-6xl font-extrabold max-w-xl leading-tight"
          >
            {{ banner.subtitle }}
          </h1>
          <p class="mt-4 text-base md:text-lg text-gray-300 max-w-md">
            {{ banner.ctaText }}
          </p>
          <button
            [routerLink]="banner.ctaLink"
            class="mt-6 px-6 py-3 bg-amber-600 hover:bg-amber-700 font-medium text-sm rounded-lg transition-colors duration-200 uppercase tracking-wide"
          >
            {{ banner.ctaText }}
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Left Navigation Control Arrow -->
  <button
    (click)="prevSlide()"
    class="absolute left-4 top-1/2 -translate-y-1/2 z-30 p-2 rounded-full bg-black/30 hover:bg-amber-600 text-white transition-all opacity-0 group-hover:opacity-100 focus:opacity-100 flex items-center justify-center"
  >
    <mat-icon class="!h-6 !w-6 !text-[24px]">chevron_left</mat-icon>
  </button>

  <!-- Right Navigation Control Arrow -->
  <button
    (click)="nextSlide()"
    class="absolute right-4 top-1/2 -translate-y-1/2 z-30 p-2 rounded-full bg-black/30 hover:bg-amber-600 text-white transition-all opacity-0 group-hover:opacity-100 focus:opacity-100 flex items-center justify-center"
  >
    <mat-icon class="!h-6 !w-6 !text-[24px]">chevron_right</mat-icon>
  </button>

  <!-- Indicator Dots -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex gap-2">
    @for (slide of banners(); track slide._id) {
      <button
        (click)="setSlide($index)"
        [class]="
          currentSlide === $index ? 'w-8 bg-amber-500' : 'w-2 bg-white/40'
        "
        class="h-2 rounded-full transition-all duration-300"
      ></button>
    }
  </div>
</div>
