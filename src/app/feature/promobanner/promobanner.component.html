@if (activeBanner()) {
  <section class="my-14 max-w-7xl mx-auto px-4 sm:px-6">
    <div
      class="relative overflow-hidden rounded-3xl bg-slate-100 border border-amber-500 p-8 md:p-12 flex flex-col md:flex-row items-center justify-between gap-8 shadow-2xl"
    >
      <div
        class="absolute -right-20 -top-20 w-80 h-80 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"
      ></div>

      <div class="space-y-4 max-w-xl text-center md:text-left text-white z-10">
        <span
          class="text-amber-500 font-semibold text-xs tracking-widest uppercase"
        >
          {{ activeBanner()?.discountText }}
        </span>

        <h3
          class="text-slate-900 text-3xl md:text-4xl font-serif font-bold leading-tight"
        >
          {{ activeBanner()?.title }}
        </h3>

        <p class="text-slate-600 text-base font-medium">
          {{ activeBanner()?.subtitle }}
        </p>

        <p class="text-slate-800 text-sm leading-relaxed">
          {{ activeBanner()?.description }}
        </p>

        <a
          [routerLink]="activeBanner()?.ctaLink"
          class="inline-block mt-4 px-6 py-3 bg-amber-600 hover:bg-amber-500 text-slate-100 font-bold text-xs uppercase tracking-wider rounded-xl transition-all duration-200 shadow-lg shadow-amber-600/20 active:scale-95 cursor-pointer"
        >
          {{ activeBanner()?.ctaText }}
        </a>
      </div>

      <div class="relative z-10 w-full md:w-1/3 flex justify-center">
        @if (activeBanner()?.imageUrl) {
          <img
            [src]="activeBanner()?.imageUrl"
            [alt]="activeBanner()?.title"
            class="h-64 object-contain drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] transition-transform duration-500 hover:scale-105"
          />
        }
      </div>
    </div>
  </section>
}
